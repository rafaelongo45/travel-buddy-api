services:
  app:
    build:
      context: .
      dockerfile: ./docker/Dockerfile
    working_dir: /var/www
    container_name: travel-buddy-api
    user: "1000:1000"
    volumes:
      - ./:/var/www
    networks:
      - laravel
  
  nginx:
    image: nginx:latest
    container_name: nginx
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    ports:
      - 8000:80
    depends_on:
      - app
    networks:
      - laravel

  database:
    image: postgres:16
    container_name: travel_buddy_database
    volumes:
      - dbdata:/var/lib/postgresql/data
    ports:
      - "54320:5432"
    environment:
      POSTGRES_USER: travel_buddy
      POSTGRES_PASSWORD: travel_buddy
      POSTGRES_DB: travel_buddy
    networks:
      - laravel

volumes:
  dbdata:

networks:
  laravel: